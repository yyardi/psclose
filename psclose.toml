# Inputs and policy for the PS revenue close. Numbers in [policy] were inferred from
# the closed history (see docs/recognition_rules.md); change them here, not in code.

[inputs]
base = "data/synthetic_ps_recon_scaled.sqlite"
increments = ["data/july_increment.sqlite"]
out_dir = "out"

[policy]
# Planned amount = cumulative billable hours x this rate, in the item's own currency.
planned_rate = 200.0

# Fixed-fee percent-complete items stop here until an acceptance event is confirmed.
acceptance_cap = 0.95
acceptance_events = ["customer_acceptance", "go_live", "uat_signoff"]

# Milestone items: share of contract recognised at each step. Step 1 at the effective
# date, later steps on a confirmed milestone event.
milestone_tranches = [0.5, 0.5]
milestone_events = ["milestone_completion", "uat_signoff", "customer_acceptance"]

# Hours adjustments of these kinds raise the estimate-at-completion denominator.
# Paid change requests do not: they come with their own contract item.
eac_adjustment_types = ["internal", "no_charge"]

# Time and materials: history recognised every logged hour, billable or not.
tm_rate = 200.0
tm_count_nonbillable = true

# Percent-complete snapshots that drive recognition must come from this source.
poc_source = "delivery_lead_confirmation"

# Timesheet notes containing this text mark hours logged before the scope is contractually
# live. An item whose only hours carry this tag stays open until its effective date.
pre_effective_note = "pre-effective"

# When a project has several open items and the timesheet does not say which one,
# split the hours this way. Options: remaining_planned_hours, planned_hours.
hours_allocation = "remaining_planned_hours"
